<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050609;display:flex;align-items:center;justify-content:center;min-height:100vh}
  ::selection{background:rgba(124,108,255,.35)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes logoIn{0%{opacity:0;transform:scale(.7) translateY(10px)}60%{opacity:1}100%{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes blob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
  @keyframes blob2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,30px) scale(1.2)}100%{transform:translate(0,0) scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes haloPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
  @keyframes sweep{0%{left:-30%}100%{left:130%}}
  @keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.8);opacity:0}}
  @keyframes barGrow{from{width:8%}to{width:72%}}
  @keyframes tipFade{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="position:relative;width:1100px;height:720px;background:radial-gradient(120% 100% at 50% 30%,#12141d,#0a0b10 70%);border:1px solid #ffffff16;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);font-family:'Manrope',sans-serif;color:#eef1f8;
  --accent:#7c6cff;--accent-2:#22d3ee;--ease:cubic-bezier(.2,.8,.2,1)">

  <!-- ambient -->
  <div style="position:absolute;inset:0;pointer-events:none;z-index:0">
    <div style="position:absolute;top:-120px;left:50%;margin-left:-280px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.2),transparent 70%);filter:blur(40px);animation:blob 16s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-180px;right:-40px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);filter:blur(40px);animation:blob2 20s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:52px 52px;mask-image:radial-gradient(circle at 50% 42%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 42%,#000,transparent 70%)"></div>
  </div>

  <!-- draggable titlebar hint -->
  <div style="position:absolute;top:0;left:0;right:0;height:38px;z-index:2"></div>

  <!-- center -->
  <div style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20px">

    <!-- logo mark -->
    <div style="position:relative;animation:logoIn .8s var(--ease) both">
      <div style="position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.35),transparent 70%);animation:haloPulse 3s ease-in-out infinite;filter:blur(6px)"></div>
      <span style="position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(124,108,255,.4);animation:ring 2.6s ease-out infinite"></span>
      <div style="animation:float 6s ease-in-out infinite">
        <dc-import name="YMark" variant="app" size="{{ 112 }}" speed="{{ 7 }}" hint-size="112px,112px"></dc-import>
      </div>
    </div>

    <div style="font-family:'Space Grotesk';font-weight:700;font-size:44px;letter-spacing:-.02em;margin-top:30px;animation:fade .8s var(--ease) both;animation-delay:.25s">yGAMES</div>
    <div style="font-size:14px;color:#8b93a7;margin-top:7px;animation:fade .8s var(--ease) both;animation-delay:.35s">Les soirées jeux de la bande</div>

    <!-- loading bar -->
    <div style="margin-top:42px;width:280px;animation:fade .8s var(--ease) both;animation-delay:.5s">
      <div style="height:4px;border-radius:4px;background:#ffffff10;overflow:hidden">
        <div style="height:100%;border-radius:4px;background:linear-gradient(90deg,#7c6cff,#22d3ee);width:72%;animation:barGrow 2.4s var(--ease) both;box-shadow:0 0 16px rgba(124,108,255,.6)"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;color:#5f6982;font-size:12.5px;font-weight:500;animation:tipFade 2.4s ease-in-out infinite">
        <span style="width:14px;height:14px;border-radius:50%;border:2px solid #7c6cff;border-top-color:transparent;animation:spin .8s linear infinite;display:inline-block"></span>
        Connexion aux serveurs de jeu…
      </div>
    </div>
  </div>

  <!-- footer -->
  <div style="position:absolute;bottom:20px;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;animation:fade 1s var(--ease) both;animation-delay:.7s">
    <span style="font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;color:#3a4152">v1.4.0</span>
    <span style="width:3px;height:3px;border-radius:50%;background:#2a3040"></span>
    <span style="font-size:11px;color:#3a4152">Projet perso · entre potes</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720}}"></script>
</body>
</html>
