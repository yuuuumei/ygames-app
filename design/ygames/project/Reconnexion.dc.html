<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050609;display:flex;align-items:center;justify-content:center;min-height:100vh}
  ::selection{background:rgba(124,108,255,.35)}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
  @keyframes blob2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,30px) scale(1.2)}100%{transform:translate(0,0) scale(1)}}
  @keyframes sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
  @keyframes dot{0%,100%{box-shadow:0 0 0 0 rgba(67,209,122,.55)}70%{box-shadow:0 0 0 6px rgba(67,209,122,0)}}
  @keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 20px 60px rgba(124,108,255,.4)}50%{transform:scale(1.02);box-shadow:0 24px 80px rgba(124,108,255,.6)}}
  @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="position:relative;width:1100px;height:720px;background:#0e1016;border:1px solid #ffffff16;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);font-family:'Manrope',sans-serif;color:#eef1f8;
  --accent:#7c6cff;--accent-2:#22d3ee;--gold:#ffc24b;--online:#43d17a;--danger:#ff4d5e;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)">

  <!-- ambient -->
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0">
    <div style="position:absolute;top:-140px;left:50%;margin-left:-300px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.16),transparent 70%);filter:blur(30px);animation:blob 18s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-180px;right:-40px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.10),transparent 70%);filter:blur(30px);animation:blob2 22s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at 50% 44%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 44%,#000,transparent 70%)"></div>
  </div>

  <!-- titlebar -->
  <div style="position:relative;z-index:2;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px">
    <div style="display:flex;align-items:center;gap:8px">
      <dc-import name="YMark" variant="app" size="{{ 20 }}" speed="{{ 9 }}" glow="{{ false }}" hint-size="20px,20px"></dc-import>
      <span style="font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.18em;color:#8b93a7">YGAMES</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ffffff10;color:#eef1f8"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></div>
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ffffff10;color:#eef1f8"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></div>
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ff4d5e;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    </div>
  </div>

  <!-- center card -->
  <div style="position:relative;z-index:2;height:calc(720px - 38px);display:flex;align-items:center;justify-content:center;padding-bottom:24px">
    <div style="width:520px;background:linear-gradient(160deg,#161a24,#10131b);border:1px solid #ffffff14;border-radius:22px;padding:40px 40px 34px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .55s var(--ease) both">

      <!-- live badge -->
      <div style="display:flex;justify-content:center;margin-bottom:22px">
        <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.3);border-radius:20px;padding:7px 14px">
          <span style="position:relative;width:8px;height:8px"><span style="position:absolute;inset:0;border-radius:50%;background:#ff4d5e"></span><span style="position:absolute;inset:0;border-radius:50%;background:#ff4d5e;animation:ping 1.8s ease-out infinite"></span></span>
          <span style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ff8a95">Partie en cours</span>
        </div>
      </div>

      <!-- game emblem -->
      <div style="display:flex;justify-content:center;margin-bottom:24px">
        <div style="position:relative;width:96px;height:96px;border-radius:26px;background:radial-gradient(120% 120% at 30% 20%,#ff6572,#e0344a 60%,#9c1f30);display:grid;place-items:center;animation:float 6s ease-in-out infinite;box-shadow:0 20px 50px rgba(255,77,94,.4)">
          <span style="font-family:'Space Grotesk';font-weight:700;font-size:58px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.4)">?</span>
        </div>
      </div>

      <div style="text-align:center">
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-.02em">Ta table t'attend</div>
        <div style="font-size:15px;color:#98a1b6;margin-top:8px;line-height:1.5">Tu as quitté en pleine partie de <span style="color:#ff8a95;font-weight:700">L'Imposteur</span>.<br>La bande joue encore — reviens avant le vote.</div>
      </div>

      <!-- table meta -->
      <div style="display:flex;align-items:center;gap:14px;margin-top:24px;background:#0d0f16;border:1px solid #ffffff0d;border-radius:14px;padding:14px 16px">
        <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,#242a3a,#171b26);border:1px solid #ffffff14;display:grid;place-items:center;flex-shrink:0"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98a1b6" stroke-width="2"><path d="M3 11h18M6 15h.01M10 15h.01"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">La table de Léo</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:3px">
            <span style="font-family:'JetBrains Mono';font-weight:700;font-size:13px;letter-spacing:.24em;color:#8b93a7">KLMR</span>
            <span style="width:3px;height:3px;border-radius:50%;background:#3a4152"></span>
            <span style="font-size:12px;color:#8b93a7"><span style="color:#43d17a;font-weight:700">3</span> joueurs présents</span>
          </div>
        </div>
        <!-- mini avatars -->
        <div style="display:flex">
          <sc-for list="{{ avatars }}" as="a" hint-placeholder-count="3">
            <div style="position:relative;width:30px;height:30px;border-radius:50%;background:{{ a.color }};display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;border:2px solid #0d0f16;margin-left:-8px">{{ a.initial }}</div>
          </sc-for>
        </div>
      </div>

      <!-- actions -->
      <div onClick="{{ noop }}" style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;background:linear-gradient(135deg,#7c6cff,#5a49e0);color:#fff;font-weight:700;font-size:17px;height:58px;border-radius:14px;cursor:pointer;animation:breathe 3s ease-in-out infinite;transition:transform .18s var(--spring)" style-hover="transform:translateY(-2px)" style-active="transform:translateY(0) scale(.99)">
        <span style="position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sheen 4s ease-in-out infinite"></span>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Me reconnecter
      </div>
      <div onClick="{{ noop }}" style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;color:#8b93a7;font-weight:600;font-size:14px;height:44px;border-radius:12px;cursor:pointer;transition:all .16s var(--ease)" style-hover="background:#ffffff08;color:#ff8a95">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
        Quitter la table
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720}}">
class Component extends DCLogic {
  renderVals() {
    return {
      noop: () => {},
      avatars: [
        { initial: 'M', color: 'linear-gradient(135deg,#eb459e,#c0367f)' },
        { initial: 'S', color: 'linear-gradient(135deg,#f0b429,#d99215)' },
        { initial: 'I', color: 'linear-gradient(135deg,#22d3ee,#0e9bb5)' },
      ],
    };
  }
}
</script>
</body>
</html>
