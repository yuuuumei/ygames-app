<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050609;display:flex;align-items:center;justify-content:center;min-height:100vh}
  ::selection{background:rgba(34,211,238,.35)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes sweep{0%{left:-40%}100%{left:140%}}
  @keyframes blob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
</style>
</helmet>
<div style="position:relative;width:1100px;height:720px;background:#0e1016;border:1px solid #ffffff16;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);font-family:'Manrope',sans-serif;color:#eef1f8;
  --accent:#7c6cff;--accent-2:#22d3ee;--gold:#ffc24b;--online:#43d17a;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)">

  <!-- dimmed backdrop -->
  <div style="position:absolute;inset:0;z-index:0;background:#050609cc;backdrop-filter:blur(3px)"></div>
  <div style="position:absolute;inset:0;z-index:0;opacity:.3;overflow:hidden">
    <div style="position:absolute;top:-100px;left:-60px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.2),transparent 70%);filter:blur(30px);animation:blob 18s ease-in-out infinite"></div>
  </div>

  <!-- switcher tabs (review) -->
  <div style="position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:4px;background:#0b0d13cc;backdrop-filter:blur(8px);border:1px solid #ffffff14;border-radius:10px;padding:4px">
    <span style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#4b5468;font-weight:700;padding:0 8px">Jeu</span>
    <div onClick="{{ pickSpy }}" style="font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px;cursor:pointer;color:{{ spyC }};background:{{ spyBg }};transition:all .15s var(--ease)">Spyfall</div>
    <div onClick="{{ pickQuiz }}" style="font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px;cursor:pointer;color:{{ quizC }};background:{{ quizBg }};transition:all .15s var(--ease)">Quiz Culture</div>
  </div>

  <!-- modal -->
  <div style="position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:30px">
    <div style="position:relative;width:720px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#171b26,#0f1218);border:1px solid #ffffff16;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:modalIn .5s var(--spring) both">

      <!-- close -->
      <div style="position:absolute;top:16px;right:16px;z-index:3;width:34px;height:34px;border-radius:10px;background:#ffffff0d;display:grid;place-items:center;color:#98a1b6;cursor:pointer;transition:all .16s var(--ease)" style-hover="background:#ffffff1a;color:#eef1f8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></div>

      <!-- hero -->
      <div style="position:relative;height:240px;overflow:hidden;background:{{ heroBg }}">
        <div style="position:absolute;top:-40px;right:30px;font-family:'Space Grotesk';font-weight:700;font-size:240px;line-height:1;color:#ffffff09;user-select:none">{{ heroGlyph }}</div>
        <div style="position:absolute;inset:0;background:linear-gradient(0deg,#171b26,transparent 60%)"></div>
        <div style="position:relative;height:100%;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="display:inline-flex;align-items:center;gap:6px;background:#ffffff14;backdrop-filter:blur(6px);border:1px solid #ffffff20;color:#eef1f8;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:20px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Bientôt</span>
            <span style="font-size:12px;color:#c3c9d6;font-weight:600">{{ players }}</span>
          </div>
          <div style="display:flex;align-items:flex-end;gap:16px">
            <div style="width:72px;height:72px;border-radius:20px;background:{{ emblemBg }};display:grid;place-items:center;box-shadow:0 12px 34px rgba(0,0,0,.4);flex-shrink:0;animation:floatY 6s ease-in-out infinite">
              <sc-if value="{{ isSpy }}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#04222a" stroke-width="2.2"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 17 9 5 9-5M3 12l9 5 9-5"/></svg></sc-if>
              <sc-if value="{{ isQuiz }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3a2600" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></sc-if>
            </div>
            <div>
              <div style="font-family:'Space Grotesk';font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em">{{ title }}</div>
              <div style="font-size:14px;color:#c3c9d6;margin-top:8px">{{ tagline }}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- body -->
      <div style="padding:26px 32px 30px">
        <div style="font-size:15px;color:#c3c9d6;line-height:1.6;text-wrap:pretty">{{ pitch }}</div>

        <!-- how it works -->
        <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5f6982;font-weight:700;margin:24px 0 14px">Comment on joue</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
          <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
            <div style="background:#0d0f16;border:1px solid #ffffff0d;border-radius:12px;padding:15px 16px">
              <div style="width:30px;height:30px;border-radius:9px;background:{{ s.bg }};display:grid;place-items:center;color:{{ s.ic }};margin-bottom:11px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="{{ s.icon }}"/></svg></div>
              <div style="font-weight:700;font-size:13.5px">{{ s.t }}</div>
              <div style="font-size:12px;color:#8b93a7;margin-top:3px;line-height:1.5">{{ s.d }}</div>
            </div>
          </sc-for>
        </div>

        <!-- footer: date + notify -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid #ffffff0d">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="width:42px;height:42px;border-radius:11px;background:#0d0f16;border:1px solid #ffffff10;display:grid;place-items:center;color:{{ accentColor }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
            <div>
              <div style="font-size:11px;color:#5f6982;font-weight:600;text-transform:uppercase;letter-spacing:.1em">Sortie estimée</div>
              <div style="font-family:'Space Grotesk';font-weight:700;font-size:17px;margin-top:1px">{{ date }}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:9px;background:{{ notifyBg }};color:{{ notifyColor }};font-weight:700;font-size:14px;height:46px;padding:0 20px;border-radius:12px;cursor:pointer;box-shadow:{{ notifyShadow }};transition:transform .16s var(--spring)" style-hover="transform:translateY(-2px)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Préviens-moi</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = { game: 'spy' };
  renderVals() {
    const g = this.state.game;
    const isSpy = g === 'spy';
    const spy = {
      accentColor: '#22d3ee',
      heroBg: 'radial-gradient(110% 120% at 80% 0%,rgba(34,211,238,.4),transparent 55%),linear-gradient(120deg,#0c1f26,#0f1218)',
      heroGlyph: '◎',
      emblemBg: 'linear-gradient(140deg,#22d3ee,#0e7f96)',
      players: '4 – 8 joueurs · ~10 min',
      title: 'Spyfall',
      tagline: 'Un lieu secret. Un espion qui l\'ignore. Des questions qui piègent.',
      pitch: "Tout le monde connaît le lieu — la plage, le sous-marin, le casino — sauf l'espion. À tour de rôle, vous vous posez des questions pour dénicher l'intrus… sans trop en dire, sinon l'espion devine le lieu et gagne. Le fun est dans l'ambiguïté : assez précis pour prouver que tu sais, assez flou pour ne pas te trahir.",
      steps: [
        { t: 'Un lieu, un espion', d: 'Chacun reçoit le lieu, sauf un.', bg: 'rgba(34,211,238,.14)', ic: '#22d3ee', icon: 'M12 2 3 7l9 5 9-5-9-5Z' },
        { t: 'Questions croisées', d: 'On se cuisine à tour de rôle.', bg: 'rgba(124,108,255,.14)', ic: '#a99cff', icon: 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z' },
        { t: 'Démasque ou devine', d: 'La bande accuse, l\'espion tente le lieu.', bg: 'rgba(255,194,75,.14)', ic: '#ffc24b', icon: 'M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z' },
      ],
      date: 'Été 2026',
      notifyBg: 'linear-gradient(135deg,#22d3ee,#12a8c4)', notifyColor: '#04222a', notifyShadow: '0 8px 22px rgba(34,211,238,.35)',
    };
    const quiz = {
      accentColor: '#ffc24b',
      heroBg: 'radial-gradient(110% 120% at 80% 0%,rgba(255,194,75,.36),transparent 55%),linear-gradient(120deg,#26200c,#0f1218)',
      heroGlyph: '!',
      emblemBg: 'linear-gradient(140deg,#ffc24b,#d99215)',
      players: '2 – 10 joueurs · ~12 min',
      title: 'Quiz Culture',
      tagline: 'Le buzzer le plus rapide de la bande rafle la mise.',
      pitch: "Des questions de culture générale, de la plus évidente à la plus retorse. Premier à buzzer, premier à répondre — mais une erreur laisse la main aux autres. Manches thématiques, chrono qui accélère, et un classement final qui désigne le cerveau (et le boulet) de la soirée.",
      steps: [
        { t: 'La question tombe', d: 'Tout le monde la voit en même temps.', bg: 'rgba(255,194,75,.14)', ic: '#ffc24b', icon: 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z' },
        { t: 'Buzz au plus vite', d: 'Le premier prend la main.', bg: 'rgba(255,77,94,.14)', ic: '#ff8a95', icon: 'M13 2 3 14h9l-1 8 10-12h-9l1-8Z' },
        { t: 'Classement', d: 'Le cerveau de la soirée est couronné.', bg: 'rgba(124,108,255,.14)', ic: '#a99cff', icon: 'M3 7l4.5 4L12 5l4.5 6L21 7l-1.8 11H4.8L3 7Z' },
      ],
      date: 'Fin 2026',
      notifyBg: 'linear-gradient(135deg,#ffc24b,#e0a020)', notifyColor: '#3a2600', notifyShadow: '0 8px 22px rgba(255,194,75,.35)',
    };
    const d = isSpy ? spy : quiz;
    return {
      ...d,
      isSpy, isQuiz: !isSpy,
      pickSpy: () => this.setState({ game: 'spy' }), pickQuiz: () => this.setState({ game: 'quiz' }),
      spyC: isSpy ? '#fff' : '#8b93a7', spyBg: isSpy ? '#22d3ee' : 'transparent',
      quizC: !isSpy ? '#fff' : '#8b93a7', quizBg: !isSpy ? '#ffc24b' : 'transparent',
    };
  }
}
</script>
</body>
</html>
