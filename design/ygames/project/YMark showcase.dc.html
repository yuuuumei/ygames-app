<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#050609;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}</style>
</helmet>
<div style="width:1100px;background:#0e1016;border:1px solid #ffffff16;border-radius:14px;padding:36px;font-family:'Manrope',sans-serif;color:#eef1f8">
  <div style="font-family:'Space Grotesk';font-weight:700;font-size:24px;letter-spacing:-.02em">YMark — anneau vivant</div>
  <div style="font-size:13px;color:#8b93a7;margin-top:5px">Composant réutilisable. Dégradé conique qui tourne en boucle ; couleur pilotée par <code style="font-family:'JetBrains Mono';color:#a99cff">variant</code>. Taille & vitesse en props.</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(158deg,#141824,#0f1119);border:1px solid #ffffff10;border-radius:14px;padding:24px 16px">
        <dc-import name="YMark" variant="{{ it.v }}" size="{{ 72 }}" speed="{{ it.s }}" hint-size="72px,72px"></dc-import>
        <div style="text-align:center"><div style="font-weight:700;font-size:13.5px">{{ it.t }}</div><div style="font-family:'JetBrains Mono';font-size:10.5px;color:#5f6982;margin-top:3px">{{ it.tag }}</div></div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;gap:26px;margin-top:26px;background:linear-gradient(158deg,#141824,#0f1119);border:1px solid #ffffff10;border-radius:14px;padding:24px 26px">
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5f6982;font-weight:700;width:90px">Tailles</div>
    <dc-import name="YMark" variant="app" size="{{ 120 }}" hint-size="120px,120px"></dc-import>
    <dc-import name="YMark" variant="app" size="{{ 72 }}" hint-size="72px,72px"></dc-import>
    <dc-import name="YMark" variant="app" size="{{ 44 }}" hint-size="44px,44px"></dc-import>
    <dc-import name="YMark" variant="app" size="{{ 24 }}" hint-size="24px,24px"></dc-import>
    <dc-import name="YMark" variant="app" size="{{ 16 }}" hint-size="16px,16px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:560}}">
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { v: 'app', t: 'App', tag: 'violet→cyan', s: 6 },
      { v: 'imposteur', t: "L'Imposteur", tag: 'rouge', s: 5 },
      { v: 'spyfall', t: 'Spyfall', tag: 'cyan', s: 6 },
      { v: 'quiz', t: 'Quiz Culture', tag: 'or', s: 6 },
      { v: 'online', t: 'En ligne', tag: 'vert calme', s: 6 },
      { v: 'victoire', t: 'Victoire', tag: 'or & vert · rapide', s: 2.2 },
      { v: 'defaite', t: 'Défaite', tag: 'oxblood sombre', s: 8 },
      { v: 'attente', t: 'En attente', tag: 'gris · lent', s: 10 },
    ] };
  }
}
</script>
</body>
</html>
