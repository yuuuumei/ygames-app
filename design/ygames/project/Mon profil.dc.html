<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#050609;display:flex;align-items:center;justify-content:center;min-height:100vh}
  ::selection{background:rgba(124,108,255,.35)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes blob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(36px,-26px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes cardPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes confRise{0%{opacity:0;transform:translateY(20px) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(-260px) rotate(340deg)}}
  @keyframes shockRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  @keyframes spotSweep{0%{transform:translateX(-140px) rotate(8deg);opacity:0}20%{opacity:.9}100%{transform:translateX(140px) rotate(8deg);opacity:0}}
  @keyframes goldFall{0%{opacity:0;transform:translateY(-40px)}15%{opacity:1}100%{opacity:0;transform:translateY(240px)}}
  @keyframes glitchX{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
  @keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="position:relative;width:1100px;height:720px;background:#0e1016;border:1px solid #ffffff16;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);font-family:'Manrope',sans-serif;color:#eef1f8;
  --gold:#ffc24b;--online:#43d17a;--danger:#ff4d5e;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--sig:{{ sig }}">

  <!-- ambient -->
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;top:-120px;left:-60px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,{{ sigGlowA }},transparent 70%);filter:blur(30px);animation:blob 20s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-160px;right:-40px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.08),transparent 70%);filter:blur(30px);animation:blob 24s ease-in-out infinite"></div>
  </div>

  <!-- titlebar -->
  <div style="position:relative;z-index:2;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff0d">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488;cursor:pointer" style-hover="background:#ffffff10;color:#eef1f8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></div>
      <dc-import name="YMark" variant="app" size="{{ 20 }}" speed="{{ 9 }}" glow="{{ false }}" hint-size="20px,20px"></dc-import>
      <span style="font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.18em;color:#8b93a7">YGAMES · MON PROFIL</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ffffff10;color:#eef1f8"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></div>
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ffffff10;color:#eef1f8"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></div>
      <div style="width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#6b7488" style-hover="background:#ff4d5e;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    </div>
  </div>

  <div style="position:relative;z-index:2;display:flex;height:calc(720px - 38px)">

    <!-- LEFT: live preview -->
    <div style="width:376px;border-right:1px solid #ffffff0d;background:#0b0d13;display:flex;flex-direction:column;padding:26px 26px 20px;animation:fade .5s var(--ease) both">
      <div style="font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#5f6982;font-weight:700">Aperçu en direct</div>

      <!-- avatar card -->
      <div style="position:relative;margin-top:22px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0%,{{ sigGlowB }},transparent 60%),linear-gradient(160deg,#141824,#0e1119);border:1px solid #ffffff12;padding:30px 24px 24px;overflow:hidden">
        <!-- win effect overlay -->
        <div style="position:absolute;inset:0;pointer-events:none;z-index:3">{{ effectOverlay }}</div>

        <div style="display:flex;flex-direction:column;align-items:center">
          <!-- avatar with equipped border -->
          <div style="position:relative;width:118px;height:118px;display:grid;place-items:center;animation:floatY 6s ease-in-out infinite">
            <div style="{{ ringStyle }}"></div>
            <div style="position:relative;z-index:1;width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#5865f2,#7c6cff);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:40px;color:#fff">L</div>
            <span style="position:absolute;z-index:2;right:8px;bottom:8px;width:16px;height:16px;border-radius:50%;background:#43d17a;border:3px solid #0e1119"></span>
          </div>

          <div style="font-family:'Space Grotesk';font-weight:700;font-size:24px;margin-top:16px;letter-spacing:-.01em">Léo</div>
          <!-- equipped title -->
          <div style="display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:6px 13px;border-radius:20px;background:{{ titleBg }};border:1px solid {{ titleBorder }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="{{ sig }}" stroke="none"><path d="M3 7l4.5 4L12 5l4.5 6L21 7l-1.8 11H4.8L3 7Z"/></svg>
            <span style="font-weight:700;font-size:13px;color:{{ titleColor }}">{{ equippedTitleLabel }}</span>
          </div>
          <div style="font-family:'JetBrains Mono';font-size:11px;color:#5f6982;margin-top:8px">leo#4417</div>
        </div>
      </div>

      <!-- signature color -->
      <div style="margin-top:20px">
        <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5f6982;font-weight:700;margin-bottom:12px">Couleur de signature</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="8">
            <div onClick="{{ s.pick }}" style="width:34px;height:34px;border-radius:10px;background:{{ s.color }};cursor:pointer;position:relative;transition:transform .16s var(--spring);box-shadow:{{ s.shadow }}" style-hover="transform:scale(1.12)">
              <sc-if value="{{ s.active }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;display:grid;place-items:center;color:#fff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- test win effect -->
      <div onClick="{{ testEffect }}" style="margin-top:auto;display:flex;align-items:center;justify-content:center;gap:9px;background:#ffffff0d;border:1px solid #ffffff14;color:#eef1f8;font-weight:700;font-size:14px;height:46px;border-radius:12px;cursor:pointer;transition:all .16s var(--ease)" style-hover="background:#ffffff16">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 5v14l11-7z"/></svg>Tester mon effet de victoire
      </div>
    </div>

    <!-- RIGHT: customization -->
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <!-- tabs -->
      <div style="display:flex;align-items:center;gap:6px;padding:20px 26px 0;animation:rise .5s var(--ease) both">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.pick }}" style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px 11px 0 0;cursor:pointer;font-weight:700;font-size:14px;color:{{ t.color }};background:{{ t.bg }};border:1px solid {{ t.border }};border-bottom:none;transition:all .16s var(--ease)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="{{ t.icon }}"/></svg>{{ t.label }}
          </div>
        </sc-for>
      </div>
      <div style="height:1px;background:#ffffff14;margin:0 26px"></div>

      <!-- content -->
      <div style="flex:1;overflow-y:auto;padding:22px 26px 26px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div style="font-size:13px;color:#8b93a7">{{ tabHint }}</div>
          <div style="font-size:12px;color:#5f6982"><span style="color:#eef1f8;font-weight:700">{{ unlockedCount }}</span> / {{ totalCount }} débloqués</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat({{ cols }},1fr);gap:14px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
            <div onClick="{{ it.action }}" style="position:relative;border-radius:14px;background:{{ it.cardBg }};border:1.5px solid {{ it.cardBorder }};padding:{{ it.pad }};cursor:{{ it.cursor }};transition:transform .18s var(--spring),border-color .2s var(--ease);animation:cardPop .4s var(--spring) both;opacity:{{ it.opacity }}" style-hover="{{ it.hover }}">
              <!-- equipped tick -->
              <sc-if value="{{ it.equipped }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:5px;background:{{ sig }};color:#06070c;font-size:10px;font-weight:800;letter-spacing:.04em;padding:4px 8px;border-radius:6px;animation:checkPop .3s var(--spring) both"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg>ÉQUIPÉ</div>
              </sc-if>
              <!-- lock -->
              <sc-if value="{{ it.locked }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;top:10px;right:10px;z-index:2;width:24px;height:24px;border-radius:7px;background:#00000055;display:grid;place-items:center;color:#98a1b6"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
              </sc-if>

              <!-- visual -->
              <div style="height:{{ it.visualH }};display:flex;align-items:center;justify-content:center">{{ it.visual }}</div>
              <!-- label -->
              <div style="margin-top:12px">
                <div style="font-family:'Space Grotesk';font-weight:700;font-size:15px;color:{{ it.nameColor }}">{{ it.name }}</div>
                <div style="font-size:11.5px;color:{{ it.subColor }};margin-top:3px;line-height:1.4">{{ it.sub }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = {
    sig: '#7c6cff',
    tab: 'titres',
    title: 'cameleon',
    border: 'neon',
    effect: 'confettis',
    playKey: 0,
  };
  hexA(hex, a){const h=String(hex).replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},${a})`;}

  // ---- ring (avatar border) preview ----
  ringLayer(kind, c, size){
    const inset = -1 * Math.round(size*0.11);
    const base = `position:absolute;inset:${inset}px;border-radius:50%;`;
    switch(kind){
      case 'sobre':   return base+`border:${Math.max(2,size*0.03)}px solid rgba(255,255,255,.16);`;
      case 'neon':    return base+`border:${Math.max(2,size*0.035)}px solid ${c};box-shadow:0 0 ${size*0.18}px ${this.hexA(c,.7)},inset 0 0 ${size*0.08}px ${this.hexA(c,.5)};`;
      case 'conique': return base+`background:conic-gradient(from 0deg, ${c}, ${this.hexA(c,.15)}, ${c});-webkit-mask:radial-gradient(circle, transparent ${size*0.42}px, #000 ${size*0.44}px);mask:radial-gradient(circle, transparent ${size*0.42}px, #000 ${size*0.44}px);animation:spin 5s linear infinite;`;
      case 'or':      return base+`background:conic-gradient(from 0deg,#ffe08a,#d99215,#fff2c2,#d99215,#ffe08a);-webkit-mask:radial-gradient(circle, transparent ${size*0.42}px, #000 ${size*0.44}px);mask:radial-gradient(circle, transparent ${size*0.42}px, #000 ${size*0.44}px);animation:spin 8s linear infinite;box-shadow:0 0 ${size*0.14}px rgba(255,194,75,.5);`;
      case 'pointille':return base+`border:${Math.max(2,size*0.035)}px dashed ${c};`;
      case 'givre':   return base+`border:${Math.max(2,size*0.035)}px solid rgba(220,240,255,.7);box-shadow:0 0 ${size*0.16}px rgba(160,220,255,.5),inset 0 0 ${size*0.06}px rgba(200,235,255,.6);`;
      default:        return base;
    }
  }
  ringEl(kind,c,size){ return React.createElement('div',{style:this.styleObj(this.ringLayer(kind,c,size))}); }
  styleObj(css){const o={};css.split(';').forEach(r=>{if(!r.trim())return;const i=r.indexOf(':');const k=r.slice(0,i).trim().replace(/-([a-z])/g,(m,p)=>p.toUpperCase());o[k]=r.slice(i+1).trim();});return o;}

  miniAvatar(kind,c){
    return React.createElement('div',{style:{position:'relative',width:'54px',height:'54px',display:'grid',placeItems:'center'}},
      this.ringEl(kind,c,54),
      React.createElement('div',{style:{position:'relative',zIndex:1,width:'42px',height:'42px',borderRadius:'50%',background:'linear-gradient(135deg,#5865f2,#7c6cff)',display:'grid',placeItems:'center',fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'17px',color:'#fff'}},'L'));
  }

  // ---- win effect overlays ----
  effectEl(kind,c,key){
    if(kind==='confettis'){
      const cols=['#7c6cff','#22d3ee','#43d17a','#ffc24b','#ff4d5e',c];
      return React.createElement('div',{key,style:{position:'absolute',inset:0}},
        Array.from({length:16}).map((_,i)=>React.createElement('span',{key:i,style:{position:'absolute',top:'46%',left:(6+i*5.8)+'%',width:(6+(i%3)*3)+'px',height:(6+(i%3)*3)+'px',background:cols[i%cols.length],borderRadius:'2px',animation:`confRise ${1.6+(i%4)*0.3}s var(--ease) ${(i*0.05)}s`}})));
    }
    if(kind==='onde'){
      return React.createElement('div',{key,style:{position:'absolute',inset:0,display:'grid',placeItems:'center'}},
        [0,0.35,0.7].map((d,i)=>React.createElement('span',{key:i,style:{position:'absolute',width:'80px',height:'80px',borderRadius:'50%',border:`3px solid ${c}`,animation:`shockRing 1.1s var(--ease) ${d}s`}})));
    }
    if(kind==='spotlight'){
      return React.createElement('div',{key,style:{position:'absolute',inset:0,overflow:'hidden'}},
        React.createElement('div',{style:{position:'absolute',top:'-20%',left:'50%',width:'90px',height:'160%',marginLeft:'-45px',background:`linear-gradient(${this.hexA(c,.5)},transparent)`,filter:'blur(6px)',animation:'spotSweep 1.3s var(--ease)'}}));
    }
    if(kind==='goldrain'){
      return React.createElement('div',{key,style:{position:'absolute',inset:0}},
        Array.from({length:18}).map((_,i)=>React.createElement('span',{key:i,style:{position:'absolute',top:0,left:(3+i*5.4)+'%',width:'5px',height:'11px',borderRadius:'2px',background:i%2?'#ffe08a':'#ffc24b',animation:`goldFall ${1.4+(i%5)*0.25}s var(--ease) ${(i*0.06)}s`}})));
    }
    if(kind==='glitch'){
      return React.createElement('div',{key,style:{position:'absolute',inset:0,display:'grid',placeItems:'center'}},
        React.createElement('div',{style:{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:'34px',color:c,animation:'glitchX .5s steps(2) 3',textShadow:`2px 0 #22d3ee,-2px 0 #ff4d5e`}},'VICTOIRE'));
    }
    return null;
  }

  data(){
    const c=this.state.sig;
    const titles=[
      {id:'nouveau',name:'Nouveau venu',sub:'Rejoins ta première table',locked:false},
      {id:'cameleon',name:'Le Caméléon',sub:'Imposteur jamais démasqué',locked:false},
      {id:'limier',name:'Fin limier',sub:'5 imposteurs votés juste',locked:false},
      {id:'meneur',name:'Meneur de la bande',sub:'Hôte de 20 tables',locked:false},
      {id:'boulet',name:'Boulet de la soirée',sub:'Voté à tort 3× de suite',locked:false},
      {id:'fantome',name:'Le Fantôme',sub:'Gagne sans donner d\'indice',locked:true,cond:'Verrouillé · 0/1'},
      {id:'legende',name:'Légende yGAMES',sub:'100 parties jouées',locked:true,cond:'Verrouillé · 41/100'},
    ];
    const borders=[
      {id:'sobre',name:'Sobre',sub:'Liseré discret',locked:false},
      {id:'neon',name:'Néon',sub:'Prend ta couleur',locked:false},
      {id:'conique',name:'Anneau vivant',sub:'Dégradé qui tourne',locked:false},
      {id:'pointille',name:'Pointillé',sub:'Contour segmenté',locked:false},
      {id:'or',name:'Or vétéran',sub:'50 parties jouées',locked:true,cond:'Verrouillé · 41/50'},
      {id:'givre',name:'Givre',sub:'Gagne en hiver',locked:true,cond:'Événement'},
    ];
    const effects=[
      {id:'confettis',name:'Confettis',sub:'Le classique festif',locked:false},
      {id:'onde',name:'Onde de choc',sub:'Impact centré',locked:false},
      {id:'spotlight',name:'Spotlight',sub:'Le projecteur sur toi',locked:false},
      {id:'glitch',name:'Glitch',sub:'Distorsion RGB',locked:true,cond:'10 victoires en imposteur'},
      {id:'goldrain',name:'Pluie d\'or',sub:'Douche dorée',locked:true,cond:'Verrouillé · 41/50'},
    ];
    return {titres:titles,bordures:borders,effets:effects};
  }

  renderVals(){
    const c=this.state.sig, tab=this.state.tab;
    const d=this.data();
    const equipMap={titres:this.state.title,bordures:this.state.border,effets:this.state.effect};
    const setEquip=(id)=>{
      if(tab==='titres')this.setState({title:id});
      else if(tab==='bordures')this.setState({border:id});
      else this.setState({effect:id});
    };
    const list=d[tab];
    const items=list.map(it=>{
      const equipped=equipMap[tab]===it.id && !it.locked;
      let visual;
      if(tab==='bordures') visual=this.miniAvatar(it.id,c);
      else if(tab==='effets'){
        const ic={confettis:'M8 5v14l11-7z',onde:'M12 2a10 10 0 1 0 0 20',spotlight:'M9 18V5l12-2v13',glitch:'M4 4h6v6H4zM14 14h6v6h-6z',goldrain:'M12 3v18M7 8l5-5 5 5'}[it.id];
        visual=React.createElement('div',{style:{width:'44px',height:'44px',borderRadius:'12px',background:it.locked?'#161923':this.hexA(c,.14),display:'grid',placeItems:'center',color:it.locked?'#5f6982':c}},
          React.createElement('svg',{width:22,height:22,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.2},React.createElement('path',{d:ic})));
      } else {
        visual=React.createElement('svg',{width:26,height:26,viewBox:'0 0 24 24',fill:it.locked?'#3a4152':c,stroke:'none'},React.createElement('path',{d:'M3 7l4.5 4L12 5l4.5 6L21 7l-1.8 11H4.8L3 7Z'}));
      }
      return {
        ...it,
        equipped, locked:!!it.locked,
        action: it.locked?(()=>{}):(()=>setEquip(it.id)),
        cursor: it.locked?'not-allowed':'pointer',
        opacity: it.locked?0.55:1,
        pad: tab==='titres'?'16px 18px':'18px 16px 16px',
        cols: tab==='titres'?2:3,
        visualH: tab==='titres'?'30px':'62px',
        visual,
        cardBg: equipped?this.hexA(c,.1):'linear-gradient(158deg,#141824,#0f1119)',
        cardBorder: equipped?c:'#ffffff10',
        hover: it.locked?'':'transform:translateY(-3px);border-color:'+this.hexA(c,.5),
        nameColor: it.locked?'#98a1b6':'#eef1f8',
        subColor: it.locked?'#5f6982':'#8b93a7',
        sub: it.locked?it.cond:it.sub,
      };
    });
    const tabs=[
      {id:'titres',label:'Titres',icon:'M4 7h16M4 12h10M4 17h7'},
      {id:'bordures',label:'Bordures d\'avatar',icon:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z'},
      {id:'effets',label:'Effet de victoire',icon:'M13 2 3 14h9l-1 8 10-12h-9l1-8Z'},
    ].map(t=>({
      ...t, pick:()=>this.setState({tab:t.id}),
      color: tab===t.id?'#eef1f8':'#8b93a7',
      bg: tab===t.id?'#141824':'transparent',
      border: tab===t.id?'#ffffff14':'transparent',
    }));
    const swPalette=['#7c6cff','#22d3ee','#43d17a','#ffc24b','#ff4d5e','#eb459e','#5865f2','#14b8a6'];
    const equippedTitle=d.titres.find(t=>t.id===this.state.title);
    const tabHints={titres:'Un seul titre affiché sous ton pseudo.',bordures:'L\'anneau autour de ton avatar Discord.',effets:'Ta mise en scène au moment de gagner.'};
    return {
      sig:c,
      sigGlowA:this.hexA(c,.16), sigGlowB:this.hexA(c,.18),
      ringStyle:this.ringLayer(this.state.border,c,118),
      titleBg:this.hexA(c,.12), titleBorder:this.hexA(c,.3), titleColor:'#eef1f8',
      equippedTitleLabel: equippedTitle?equippedTitle.name:'—',
      swatches: swPalette.map(col=>({color:col,active:col.toLowerCase()===c.toLowerCase(),pick:()=>this.setState({sig:col}),shadow:col.toLowerCase()===c.toLowerCase()?`0 0 0 2px #0b0d13,0 0 0 4px ${col}`:'none'})),
      tabs, items, tabHint:tabHints[tab],
      cols: tab==='titres'?2:3,
      unlockedCount: list.filter(x=>!x.locked).length, totalCount:list.length,
      testEffect:()=>this.setState(s=>({playKey:s.playKey+1})),
      effectOverlay: this.effectEl(this.state.effect,c,this.state.playKey),
    };
  }
}
</script>
