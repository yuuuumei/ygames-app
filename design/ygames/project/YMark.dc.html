<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  @keyframes ymspin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="position:relative;width:{{ size }}px;height:{{ size }}px;flex-shrink:0;font-family:'Space Grotesk',sans-serif">
  <div style="position:absolute;inset:0;border-radius:50%;background:{{ ringGradient }};animation:ymspin {{ speed }}s linear infinite;box-shadow:{{ glow }}"></div>
  <div style="position:absolute;border-radius:50%;background:{{ bg }};display:grid;place-items:center;inset:{{ ringW }}px">
    <sc-if value="{{ showLetter }}" hint-placeholder-val="{{ true }}">
      <span style="font-weight:700;font-size:{{ letterSize }}px;line-height:1;color:{{ letterColor }};transform:translateY(-{{ letterNudge }}px)">{{ letter }}</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:80},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;app&quot;,&quot;imposteur&quot;,&quot;spyfall&quot;,&quot;quiz&quot;,&quot;online&quot;,&quot;victoire&quot;,&quot;defaite&quot;,&quot;attente&quot;],&quot;default&quot;:&quot;app&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Anneau&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;min&quot;:16,&quot;max&quot;:220,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:0.6,&quot;max&quot;:16,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Anneau&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0e1016&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;letter&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;y&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;letterColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffffff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;colors&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;showLetter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const size = Number(p.size ?? 56);
    // palettes par jeu / état
    const palettes = {
      app:       ['#7c6cff', '#22d3ee', '#7c6cff'],
      imposteur: ['#ff4d5e', '#ff8a95', '#ff4d5e'],   // corail vif
      spyfall:   ['#22d3ee', '#7c6cff', '#22d3ee'],
      quiz:      ['#ffc24b', '#ff8a95', '#ffc24b'],
      online:    ['#43d17a', '#2ba85d', '#43d17a'],   // vert calme uni (présence)
      victoire:  ['#ffd479', '#43d17a', '#7cf0a8'],   // or + vert, festif & éclatant
      defaite:   ['#8f0f24', '#2a0209', '#8f0f24'],   // oxblood sombre, lourd
      attente:   ['#5f6982', '#98a1b6', '#5f6982'],
    };
    const variant = p.variant ?? 'app';
    const colors = Array.isArray(p.colors) && p.colors.length ? p.colors : (palettes[variant] || palettes.app);
    const stops = colors.length === 1 ? [colors[0], colors[0]] : [...colors, colors[0]];
    const ringGradient = `conic-gradient(from 0deg, ${stops.join(', ')})`;
    const ringW = Math.max(2, Math.round(size * 0.125));
    const bg = p.bg ?? '#0e1016';
    const showLetter = (p.showLetter ?? true) && size >= 20;
    const glowColor = colors[0];
    return {
      size, ringGradient, ringW, bg,
      speed: Number(p.speed ?? 6),
      glow: p.glow === false ? 'none' : `0 ${Math.round(size*0.16)}px ${Math.round(size*0.42)}px ${this.hexA(glowColor, .4)}`,
      showLetter,
      letter: p.letter ?? 'y',
      letterColor: p.letterColor ?? '#fff',
      letterSize: Math.round(size * 0.46),
      letterNudge: Math.max(1, Math.round(size * 0.035)),
    };
  }
  hexA(hex, a) {
    const h = String(hex).replace('#', '');
    if (h.length < 6) return hex;
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
}
</script>
</body>
</html>
